<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directions | Cloudberry VC</title>
    <meta name="description" content="How to find the Cloudberry VC office at Maria 01, Building 5, Entrance B, Lapinlahdenkatu 16, Helsinki.">
    <link rel="icon" href="assets/berry_icon.png" type="image/png">
    <link rel="canonical" href="https://cloudberry.vc/directions.html">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cloudberry.vc/directions.html">
    <meta property="og:title" content="Directions | Cloudberry VC">
    <meta property="og:description" content="Maria 01, Building 5, Entrance B, 3rd Floor. Lapinlahdenkatu 16, 00180 Helsinki.">
    <meta property="og:image" content="https://cloudberry.vc/assets/og-share.png">
    <meta property="og:site_name" content="Cloudberry VC">

    <!-- Cookie consent: loads Google Tag Manager only after Accept -->
    <script src="/assets/consent.js" defer></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --space-blue: #202647;
            --space-blue-dark: #181d38;
            --cloudberry-yellow: #FFBD48;
            --jade: #007A6E;
            --muted: #8090A8;
            --white: #E8EBF2;
        }

        html, body { min-height: 100%; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--space-blue);
            color: var(--white);
            line-height: 1.5;
        }

        .wrap {
            max-width: 1440px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 64px 72px;
            display: flex;
            gap: 72px;
            align-items: center;
        }

        .info {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 56px;
        }

        .info-top { display: flex; flex-direction: column; gap: 40px; }
        .logo img { width: 224px; height: auto; display: block; }

        h1 {
            font-size: 92px;
            line-height: 0.95;
            font-weight: 700;
            letter-spacing: -2px;
            text-transform: uppercase;
            color: #fff;
        }

        .bar { width: 96px; height: 6px; background: var(--cloudberry-yellow); border-radius: 3px; margin-top: 16px; }

        .info-bottom { display: flex; flex-direction: column; gap: 16px; }

        .maps {
            font-size: 20px;
            font-weight: 700;
            color: var(--cloudberry-yellow);
            text-decoration: underline;
            text-underline-offset: 4px;
        }
        .maps:hover { color: #fff; }

        address {
            font-style: normal;
            font-size: 22px;
            line-height: 1.45;
            color: var(--white);
        }
        address strong { color: #fff; }

        .map-col {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
            justify-content: center;
        }

        .map-col svg {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }

        .hint { font-size: 14px; line-height: 1.5; color: rgba(232,235,242,0.75); max-width: 440px; }

        .back { font-size: 14px; color: var(--muted); text-decoration: none; }
        .back:hover { color: var(--cloudberry-yellow); }

        @media (max-width: 1180px) {
            .wrap { flex-direction: column; align-items: flex-start; padding: 40px 24px; gap: 40px; min-height: 0; }
            .info { gap: 32px; }
            h1 { font-size: 64px; }
            .logo img { width: 180px; }
            .info { flex: none; }
            .map-col { flex: none; width: 100%; max-width: 720px; }
        }

        @media (max-width: 480px) {
            .wrap { padding: 32px 16px; }
            h1 { font-size: 48px; letter-spacing: -1px; }
            address { font-size: 18px; }
            .maps { font-size: 18px; }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <div class="info">
            <div class="info-top">
                <a class="logo" href="/"><img src="assets/logo_vc_light.png" alt="Cloudberry VC"></a>
                <div>
                    <h1>Directions</h1>
                    <div class="bar"></div>
                </div>
            </div>
            <div class="info-bottom">
                <a class="maps" href="https://www.google.com/maps/search/?api=1&amp;query=Lapinlahdenkatu+16,+00180+Helsinki" target="_blank" rel="noopener">Open in Google Maps</a>
                <address>
                    <strong>Cloudberry VC</strong><br>
                    Maria 01, Building 5<br>
                    Entrance B, 3rd Floor<br>
                    Lapinlahdenkatu 16, 00180 Helsinki, Finland
                </address>
                <a class="back" href="/">Back to cloudberry.vc</a>
            </div>
        </div>

        <div class="map-col">
            <svg viewBox="0 0 1166 778" role="img" aria-label="Map of Maria 01: enter from Lapinlahdenkatu and follow the path to Entrance B of Building 5, the white door in the red brick wall">
                <defs>
                    <clipPath id="photo-clip"><circle cx="1004" cy="612" r="140"/></clipPath>
                    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
                        <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#202647" flood-opacity="0.25"/>
                    </filter>
                </defs>
                <rect width="1166" height="778" fill="#F2F2F2"/>
                <polygon points="253,0 328,0 273,240 246,778 180,778 203,240" fill="#E4E7EC"/>
                <polygon points="800,0 1166,30 1166,88 800,48" fill="#E4E7EC"/>
                <polygon points="730,150 790,150 800,778 700,778 735,600" fill="#E9EBEF"/>
                <g fill="#FFFFFF">
                    <rect x="596" y="90" width="404" height="76"/>
                    <rect x="462" y="185" width="98" height="450"/>
                    <rect x="623" y="185" width="76" height="180"/>
                    <rect x="823" y="160" width="117" height="210"/>
                    <rect x="823" y="365" width="205" height="130"/>
                    <rect x="793" y="515" width="260" height="130"/>
                    <rect x="793" y="680" width="80" height="98"/>
                    <rect x="438" y="560" width="230" height="85"/>
                    <rect x="338" y="555" width="100" height="120"/>
                    <rect x="896" y="680" width="120" height="98"/>
                    <rect x="338" y="692" width="330" height="86"/>
                </g>
                <path d="M808,30 C790,80 765,140 752,230 C742,320 768,420 768,520 C768,620 720,684 620,684 L470,684" fill="none" stroke="#007A6E" stroke-width="6" stroke-linecap="round"/>
                <path d="M470,684 C420,684 395,705 390,752" fill="none" stroke="#007A6E" stroke-width="6" stroke-linecap="round"/>
                <circle cx="808" cy="30" r="28" fill="#007A6E"/>
                <circle cx="584" cy="506" r="20" fill="#8090A8"/>

                <g font-family="Arial, Helvetica, sans-serif" fill="#5F6B80" font-size="26" letter-spacing="1">
                    <text transform="translate(176 392) rotate(-84)" dominant-baseline="hanging">Mechelininkatu</text>
                    <text transform="translate(940 44) rotate(5)" dominant-baseline="hanging">Lapinlahdenkatu</text>
                </g>
                <g font-family="Arial, Helvetica, sans-serif" fill="#4A5468" font-size="24" text-anchor="middle">
                    <text x="584" y="436">Main entrance</text>
                    <text x="584" y="466">to Maria 01</text>
                </g>

                <g filter="url(#shadow)">
                    <rect x="242" y="636" width="296" height="72" rx="16" fill="#FFFFFF"/>
                    <polygon points="374,707 406,707 390,723" fill="#FFFFFF"/>
                </g>
                <image href="assets/logo_vc_dark.png" x="262" y="655" width="256" height="34"/>
                <circle cx="390" cy="752" r="19" fill="#007A6E" stroke="#FFFFFF" stroke-width="6"/>

                <circle cx="1004" cy="612" r="156" fill="#FFBD48" filter="url(#shadow)"/>
                <image href="assets/maria01-entrance-b.jpg" x="864" y="460" width="280" height="300" preserveAspectRatio="xMidYMid slice" clip-path="url(#photo-clip)"/>
            </svg>
            <p class="hint">Enter Maria 01 from Lapinlahdenkatu and follow the path to Building 5. Entrance B is the white door in the red brick wall.</p>
        </div>
    </main>
</body>
</html>
