<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudberry VC | Blog</title>
    <link rel="icon" href="assets/berry_icon.png" type="image/png">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --space-blue: #202647;
            --cloudberry-yellow: #FFBD48;
            --jade: #007A6E;
            --muted: #8090A8;
            --off-white: #DEE2EC;
            --white: #E8EBF2;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--white);
            color: #2A2F45;
            line-height: 1.8;
        }

        /* Nav */
        .post-nav {
            background: var(--space-blue);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .post-nav .container {
            max-width: 740px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .post-nav img { height: 24px; }

        .post-nav a.back-link {
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .post-nav a.back-link:hover { color: var(--cloudberry-yellow); }

        /* Article */
        .article {
            max-width: 740px;
            margin: 0 auto;
            padding: 60px 24px 100px;
        }

        .article-date {
            font-size: 0.85rem;
            color: var(--muted);
            font-weight: 500;
            margin-bottom: 12px;
        }

        .article h1 {
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            color: var(--space-blue);
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 24px;
            letter-spacing: -0.02em;
        }

        .article-summary {
            font-size: 1.15rem;
            color: var(--muted);
            border-left: 3px solid var(--jade);
            padding-left: 20px;
            margin-bottom: 40px;
            line-height: 1.7;
        }

        .article-cover {
            width: 100%;
            border-radius: 16px;
            margin-bottom: 40px;
        }

        /* Article content */
        .article-body h2 {
            font-size: 1.5rem;
            color: var(--space-blue);
            margin-top: 48px;
            margin-bottom: 16px;
        }

        .article-body h3 {
            font-size: 1.2rem;
            color: var(--space-blue);
            margin-top: 36px;
            margin-bottom: 12px;
        }

        .article-body p {
            margin-bottom: 20px;
            font-size: 1.05rem;
        }

        .article-body img {
            max-width: 100%;
            border-radius: 12px;
            margin: 24px 0;
        }

        .article-body blockquote {
            border-left: 3px solid var(--cloudberry-yellow);
            padding-left: 20px;
            margin: 28px 0;
            color: var(--muted);
            font-style: italic;
            font-size: 1.1rem;
        }

        .article-body a {
            color: var(--jade);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .article-body ul, .article-body ol {
            margin: 16px 0;
            padding-left: 24px;
        }

        .article-body li {
            margin-bottom: 8px;
        }

        .article-body pre {
            background: var(--space-blue);
            color: rgba(255,255,255,0.85);
            padding: 20px 24px;
            border-radius: 12px;
            overflow-x: auto;
            margin: 24px 0;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .article-body iframe, .article-body video {
            width: 100%;
            border-radius: 12px;
            margin: 24px 0;
        }

        .article-body .infographic-embed-wrapper {
            margin: 32px 0;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(32,38,71,0.08);
        }

        .article-body .infographic-embed-wrapper iframe {
            margin: 0;
            border-radius: 0;
        }

        .article-body .infographic-embed-label {
            background: var(--space-blue);
            color: #fff;
            font-size: 0.75rem;
            padding: 6px 14px;
            font-family: Arial, sans-serif;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Footer */
        .post-footer {
            max-width: 740px;
            margin: 0 auto;
            padding: 40px 24px;
            border-top: 1px solid rgba(32,38,71,0.08);
            text-align: center;
        }

        .post-footer a {
            color: var(--jade);
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 100px 20px;
            color: var(--muted);
        }

        .loading .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--off-white);
            border-top-color: var(--jade);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Grid overlay (matching main site) */
        .grid-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .grid-overlay::before {
            content: '';
            position: absolute;
            inset: -80px;
            background-image:
                linear-gradient(rgba(128,144,168,0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(128,144,168,0.07) 1px, transparent 1px);
            background-size: 80px 80px;
            animation: gridMove 25s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(80px, 80px); }
        }
    </style>
</head>
<body>

    <div class="grid-overlay"></div>

    <div class="post-nav">
        <div class="container">
            <a href="index.html"><img src="assets/logo_vc_light.png" alt="Cloudberry VC"></a>
            <a href="index.html#news" class="back-link">← Back to News</a>
        </div>
    </div>

    <article class="article" id="article">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading post...</p>
        </div>
    </article>

    <div class="post-footer">
        <a href="index.html#news">← Back to all posts</a>
    </div>

    <script>
        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        async function loadPost() {
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id');

            if (!postId) {
                showError('No post specified.');
                return;
            }

            try {
                // Load posts index
                const res = await fetch('posts/posts.json?t=' + Date.now());
                const posts = await res.json();
                const meta = posts.find(p => p.id === postId);

                if (!meta) {
                    showError('Post not found.');
                    return;
                }

                // If it's an HTML post with its own file, redirect there
                if (meta.type === 'html' && meta.file) {
                    window.location.href = 'posts/' + meta.file;
                    return;
                }

                // Load article content from individual JSON file
                let content = '';
                try {
                    const contentRes = await fetch('posts/' + postId + '.json?t=' + Date.now());
                    const contentData = await contentRes.json();
                    content = contentData.content || '';
                } catch (e) {
                    content = '<p>' + meta.summary + '</p>';
                }

                document.title = meta.title + ' | Cloudberry VC';

                const cover = meta.coverImage
                    ? `<img class="article-cover" src="${meta.coverImage}" alt="${meta.title}">`
                    : '';

                document.getElementById('article').innerHTML = `
                    <p class="article-date">${formatDate(meta.date)}</p>
                    <h1>${meta.title}</h1>
                    <p class="article-summary">${meta.summary}</p>
                    ${cover}
                    <div class="article-body">${content}</div>
                `;
            } catch (e) {
                showError('Failed to load post.');
            }
        }

        function showError(msg) {
            document.getElementById('article').innerHTML = `
                <div class="loading">
                    <p>${msg}</p>
                    <br>
                    <a href="index.html#news" style="color: #007A6E;">Back to News</a>
                </div>
            `;
        }

        loadPost();
    </script>
</body>
</html>
