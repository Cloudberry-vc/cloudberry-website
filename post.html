<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting… | Cloudberry VC</title>
    <link rel="icon" href="assets/berry_icon.png" type="image/png">
    <meta name="robots" content="noindex">
    <script>
        // Legacy route: /post.html?id=<slug> now lives at /news/<slug>/.
        // Redirect so previously shared links keep working.
        (function() {
            var id = new URLSearchParams(window.location.search).get('id');
            if (id) {
                window.location.replace('/news/' + encodeURIComponent(id) + '/');
            } else {
                window.location.replace('/news.html');
            }
        })();
    </script>
</head>
<body>
    <p>Redirecting to <a href="/news.html">the article</a>…</p>
</body>
</html>
